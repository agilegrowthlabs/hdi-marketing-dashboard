# Proxies the pipeline site's snapshots endpoint through this site.
# This is why the dashboard works cross-site: the browser only ever calls
# a same-origin path (/api/snapshots), and Netlify fetches the real endpoint
# server-side. No CORS headers needed on the pipeline site.

[[redirects]]
  from = "/api/snapshots"
  to = "https://sweet-entremet-3ff236.netlify.app/.netlify/functions/snapshots"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "https://sweet-entremet-3ff236.netlify.app/.netlify/functions/health"
  status = 200
  force = true

[build]
  publish = "."

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDI · Marketing Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F1;--card:#fff;--ink:#1A1A1A;--grey:#5A5A55;--mute:#8A8A82;
  --border:#E3E1DB;--track:#EDECE7;
  --teal:#0F5C56;--lime:#C3D82B;--sage:#8ECAC4;--taupe:#A89C8E;
  --warn:#B0392C;--warnb:#FBEEEC;--tealb:#E7F0EF;--amb:#8A6A10;--ambb:#FCF6E4;
  --f:"Archivo",system-ui,-apple-system,sans-serif;--m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.preview{background:#FBF3F1}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(14px,2.4vw,30px) 70px}
.u{font-family:var(--m);font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:500}

/* preview banner */
#pvBar{display:none;position:sticky;top:0;z-index:90;background:var(--warn);color:#fff;padding:9px 16px;text-align:center;font-family:var(--m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
body.preview #pvBar{display:block}
#pvBar b{color:#FFD9D3}

.hd{padding:22px 0 2px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mark{display:grid;grid-template-columns:9px 9px;grid-template-rows:9px 9px;gap:2px;flex:none}
.mark i{display:block;border-radius:1px}
.mark i:nth-child(1),.mark i:nth-child(4){background:var(--teal)}
.mark i:nth-child(2),.mark i:nth-child(3){background:var(--lime)}
.brand{font-family:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--teal)}
.hd .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:6px 11px;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--grey);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
.pill.ok .dot{background:var(--teal)}
.pill.part .dot{background:#B4890A}
.pill.off .dot{background:var(--warn)}
.pill button{border:0;background:transparent;padding:0;margin-left:3px;color:var(--teal);font-family:var(--m);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--grey);border-left:1px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff}
.dr{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:5px;background:#fff;padding:4px 8px;font-family:var(--m);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.dr label{font-weight:600;color:var(--mute)}
.dr input[type=date]{border:1px solid var(--border);border-radius:4px;padding:3px 5px;font-family:var(--m);font-size:10px;color:var(--ink);background:var(--bg);color-scheme:light}
.dr input[type=date]:focus{outline:2px solid var(--sage);outline-offset:0}
.dr .sepx{color:var(--mute)}
.dr button{border:0;background:var(--teal);color:#fff;border-radius:4px;padding:5px 10px;font-family:var(--m);font-size:9px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.dr button:disabled{background:var(--mute);cursor:default;opacity:.6}
.rangeNow{display:inline-flex;align-items:center;font-family:var(--m);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);padding:6px 10px;border:1px solid #BFDBD6;border-radius:5px;background:var(--tealb);white-space:nowrap}
.tog{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:6px 11px;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--grey)}
.tog i{width:24px;height:14px;border-radius:7px;background:var(--track);position:relative;transition:background .15s;flex:none}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed=true]{border-color:var(--warn);color:var(--warn)}
.tog[aria-pressed=true] i{background:var(--warn)}
.tog[aria-pressed=true] i::after{transform:translateX(10px)}

h1{font-size:clamp(22px,3.2vw,32px);font-weight:500;letter-spacing:-.03em;line-height:1.07;margin:10px 0 6px;max-width:28ch}
.sub{color:var(--grey);margin:0 0 16px;max-width:82ch;font-size:13.5px}

.alert{border-radius:8px;padding:14px 16px;margin-bottom:14px;display:none}
.alert.on{display:block}
.alert.amb{background:var(--ambb);border:1px solid #E3D6A9}
.alert.amb .u{color:var(--amb)}
.alert.amb p{color:#5C4708}
.alert.red{background:var(--warnb);border:1px solid #E8CFCB}
.alert.red .u{color:var(--warn)}
.alert.red p{color:#6B241C}
.alert .u{display:block;margin-bottom:5px}
.alert p{margin:0;font-size:13px;line-height:1.5}
.alert code{font-family:var(--m);font-size:12px;background:#fff;border:1px solid currentColor;border-radius:3px;padding:1px 5px;opacity:.85}

.tabs{display:flex;flex-wrap:wrap;gap:2px;background:#fff;border:1px solid var(--border);border-radius:7px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:transparent;border-radius:5px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--grey)}
.tabs button:hover{background:var(--bg);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--teal);color:#fff}

.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ch{padding:13px 16px;display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;border-bottom:1px solid var(--track)}
.ch h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.ch .note{font-size:10.5px;color:var(--mute);font-family:var(--m);letter-spacing:.03em}
.tag{margin-left:auto;font-family:var(--m);font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;border-radius:3px;padding:3px 7px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;border:1px solid var(--border);background:var(--bg);color:var(--grey)}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mute)}
.tag.live{border-color:#BFDBD6;background:var(--tealb);color:var(--teal)}
.tag.live::before{background:var(--teal)}
.tag.stub{border-color:#E3D6A9;background:var(--ambb);color:var(--amb)}
.tag.stub::before{background:#B4890A}
.tag.none,.tag.samp{border-color:#E8CFCB;background:var(--warnb);color:var(--warn)}
.tag.none::before,.tag.samp::before{background:var(--warn)}
.cb{padding:16px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g23{grid-template-columns:1.5fr 1fr}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media(max-width:900px){.g23{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:15px 16px;position:relative}
.kpi.hi{background:var(--teal);border-color:var(--teal)}
.kpi.sample{border-color:#E8CFCB}
.kpi.sample::after{content:"SAMPLE";position:absolute;top:8px;right:9px;font-family:var(--m);font-size:7px;letter-spacing:.1em;color:var(--warn);background:var(--warnb);border:1px solid #E8CFCB;border-radius:2px;padding:1px 4px}
.kpi .k{font-family:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--teal);display:block;margin-bottom:8px;line-height:1.4;padding-right:44px}
.kpi.hi .k{color:var(--lime)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--teal);display:block;font-variant-numeric:tabular-nums}
.kpi.hi .v{color:#fff}
.kpi .v.sm{font-size:19px}
.kpi .v.gap{color:var(--mute);font-size:22px}
.kpi .d{font-size:11.5px;color:var(--teal);display:block;margin-top:8px}
.kpi.hi .d{color:#BEE0DB}
.kpi .d.warn{color:var(--warn)}
.kpi .d.ok{color:var(--teal)}
.kpi .n{font-family:var(--m);font-size:9.5px;color:var(--mute);display:block;margin-top:4px}
.kpi.hi .n{color:#88BAB4}

.rows{display:grid;gap:9px}
.row{display:grid;grid-template-columns:minmax(150px,290px) 1fr auto;gap:11px;align-items:center;font-size:12.5px}
.row .lb{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.tr{height:17px;background:var(--track);border-radius:2px;overflow:hidden;position:relative}
.tr i{display:block;height:100%;border-radius:2px}
.tr u{position:absolute;top:-3px;width:2px;height:23px;background:var(--ink);text-decoration:none}
.row .vv{font-family:var(--m);font-size:11.5px;text-align:right;min-width:56px}
.row .vv.z{color:var(--warn)}
.row .vv.ok{color:var(--teal)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--m);font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:500;text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
th:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid var(--track);text-align:right;font-variant-numeric:tabular-nums}
td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
td.n{font-family:var(--m);font-size:11.5px}
.z{color:var(--warn);font-family:var(--m);font-size:11px}
.dsh{color:var(--mute);font-family:var(--m);font-size:11px}
tr.tot td{border-top:1px solid var(--border);font-weight:700;border-bottom:0}

svg.cv{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--track);stroke-width:1}
.axl{font-family:var(--m);font-size:8px;fill:var(--mute);letter-spacing:.05em}
.axy{font-family:var(--m);font-size:8px;fill:var(--mute)}
.ln{fill:none;stroke:var(--lime);stroke-width:2.5;stroke-linejoin:round}
.bnd{fill:var(--track);opacity:.8}
.bmk{stroke:var(--teal);stroke-width:1.5;stroke-dasharray:5 3;fill:none}
.dt{fill:var(--teal)}
.vl{font-family:var(--m);font-size:10px;fill:var(--teal);font-weight:600}
svg.cv{cursor:crosshair}
.hovln{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2;opacity:.35;pointer-events:none}
.hovdt{fill:var(--teal);stroke:#fff;stroke-width:1.5;pointer-events:none}
.hovdt.pp{fill:var(--taupe)}
.cvtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-family:var(--m);font-size:11px;line-height:1.45;padding:7px 9px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.20);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;opacity:0;transition:opacity .07s;max-width:60vw}
.cvtip.on{opacity:1}
.cvtip .vv{color:var(--lime);font-weight:600;font-size:12.5px}
.cvtip .dd{color:#cfd8d6}
.cvtip .pp{color:var(--sage)}

.take{background:var(--teal);border-radius:8px;padding:17px 19px;color:#fff}
.take .u{color:var(--lime);display:block;margin-bottom:8px}
.take p{margin:0;font-size:13.5px;line-height:1.55}
.take b{color:var(--lime)}
.acts{display:grid;gap:13px}
.act{display:grid;grid-template-columns:13px 1fr auto;gap:10px;align-items:start}
.act .sq{width:11px;height:11px;background:var(--lime);border-radius:2px;margin-top:4px}
.act .sq.red{background:var(--warn)}
.act b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.act span.d{font-size:12px;color:var(--grey);line-height:1.45}
.act .own{font-family:var(--m);font-size:9.5px;color:var(--teal);white-space:nowrap;padding-top:2px}

.empty{border:1px dashed var(--border);border-radius:7px;padding:24px 20px;text-align:center;background:var(--bg)}
.empty b{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.empty p{margin:0 auto;font-size:12.5px;color:var(--grey);max-width:62ch;line-height:1.55}
.empty code{font-family:var(--m);font-size:11.5px;background:#fff;border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.foot{font-family:var(--m);font-size:9.5px;color:var(--mute);letter-spacing:.03em;margin-top:11px;line-height:1.6}
.foot.warn{color:var(--warn)}
.foot.ok{color:var(--teal)}
.pane{display:none}.pane.on{display:block}
.pgfoot{font-family:var(--m);font-size:9.5px;color:var(--mute);letter-spacing:.03em;margin-top:22px;line-height:1.7;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div id="pvBar">Preview mode — <b>every figure on screen is synthetic</b> — for layout review only, nothing here is measured</div>
<div class="wrap">

<div class="hd">
  <span class="mark"><i></i><i></i><i></i><i></i></span>
  <span class="brand">HDI // Marketing Performance</span>
  <span class="sp"></span>
  <span class="pill" id="built"><span class="dot"></span><span id="builtTxt">Loading…</span></span>
  <span class="pill" id="feed"><span class="dot"></span><span id="feedTxt">—</span><button id="refresh">refresh</button></span>
  <span class="seg" id="rangeSeg" role="group" aria-label="Preset time range"><button data-d="7">7d</button><button data-d="30" aria-pressed="true">30d</button><button data-d="90">90d</button><button data-d="0">All</button></span><span class="dr" role="group" aria-label="Custom date range"><label for="drFrom">From</label><input type="date" id="drFrom" aria-label="Start date"><span class="sepx">→</span><label for="drTo">To</label><input type="date" id="drTo" aria-label="End date"><button id="drApply" disabled>Apply</button></span><span class="rangeNow" id="rangeNow" aria-live="polite">—</span><button class="tog" id="botTog" aria-pressed="false" title="Clarity bot filter"><i></i>Include bots</button><button class="tog" id="pvTog" aria-pressed="false"><i></i>Preview layout</button>
</div>

<h1>Marketing performance</h1>

<div class="alert red" id="alertRed"></div>
<div class="alert amb" id="alertAmb"></div>

<div class="tabs" role="tablist">
  <button role="tab" data-t="board" aria-selected="true">Board</button>
  <button role="tab" data-t="ins" aria-selected="false">Insights</button>
  <button role="tab" data-t="camp" aria-selected="false">Campaigns</button>
  <button role="tab" data-t="pipe" aria-selected="false">Pipeline</button>
  <button role="tab" data-t="web" aria-selected="false">Website</button>
  <button role="tab" data-t="blog" aria-selected="false">Blog</button>
  <button role="tab" data-t="li" aria-selected="false">LinkedIn</button>
  <button role="tab" data-t="bm" aria-selected="false">Benchmarks</button>
</div>

<div class="pane on" id="p-board"></div>
<div class="pane" id="p-ins"></div>
<div class="pane" id="p-camp"></div>
<div class="pane" id="p-pipe"></div>
<div class="pane" id="p-web"></div>
<div class="pane" id="p-blog"></div>
<div class="pane" id="p-li"></div>
<div class="pane" id="p-bm"></div>

<div class="pgfoot" id="pgfoot"></div>
</div>

<script>
(function(){
"use strict";
var API="/api/snapshots", BM_URL="/data/benchmarks.json", LI_URL="/data/linkedin.json";
var S=null, BM=null, LI=null, PV=false, DAYS=30, HIST={ga4:null,clarity:null,linkedin:null,hubspot:null,ga4_agg:null};
var LI_SORT="er", LI_DIR="desc", LI_MORE=false;  /* LinkedIn post-archive interactive sort/expand state */
/* INCLBOTS: the Clarity bot filter. false (default) = show human-only traffic (Clarity
   already excludes bots from totalSessionCount); true = add bots back for an all-traffic
   view. Governs Clarity-scoped numbers only — GA4 applies its own server-side filtering
   and cannot be re-filtered by Clarity's per-session detection. */
var INCLBOTS=false;
/* Range state: RAW caches the full fetched history per source; WIN is the selected
   [start,end] window (inclusive, ISO dates); MODE tracks preset vs custom so labels
   read correctly; LASTPRESET remembers which preset button to re-apply on refresh.
   WIDE is fetched once and covers all stored history — the backend caps it to what
   exists, so the date buttons never trigger a refetch, they just re-window RAW. */
var RAW={ga4:null,clarity:null,linkedin:null,hubspot:null};
var WIN={start:null,end:null}, MODE="preset", LASTPRESET=30, WIDE=400;

function $(i){return document.getElementById(i);}
function isoDay(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
function todayISO(){return isoDay(new Date());}
function shiftISO(iso,delta){var d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+delta);return isoDay(d);}
function daysInclusive(a,b){if(!a||!b)return 0;return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/86400000)+1;}
function fmtDay(iso){if(!iso)return "—";var d=new Date(iso+"T00:00:00Z");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});}
function rowDate(r){return r.date||(r.pulled_at||"").slice(0,10);}
/* HDI's public website base — page paths from GA4 link back to the live page. HDI's true
   site is www.hd-innovations.com (NOT hdi.com). Change here if the domain moves. */
var SITE_URL="https://www.hd-innovations.com";
function pageURL(p){p=(p||"").replace(/[?#].*$/,"");if(/^https?:/i.test(p))return p;return SITE_URL+(p.charAt(0)==="/"?"":"/")+p;}
function pageLink(p,label){var pth=(p||"").replace(/[?#].*$/,"");var txt=label||pth||"/";
  /* only linkify real site paths — GA4 placeholders like "(not set)" or "(other)" aren't pages */
  if(!/^\//.test(pth)||/^\(/.test(pth))return '<span style="color:var(--mute)">'+esc(txt)+'</span>';
  return '<a href="'+esc(pageURL(pth))+'" target="_blank" rel="noopener" style="color:var(--teal);border-bottom:1px solid var(--sage);text-decoration:none">'+esc(txt)+'</a>';}
/* Plain-language definitions for GA4's default channel groups — most people don't know what
   "Unassigned" or "AI Assistant" mean. Rendered under the channel charts for the channels present. */
var CHANNEL_DEF={
  "Direct":"typed or bookmarked",
  "Organic Search":"unpaid Google/Bing",
  "Organic Social":"unpaid social (LinkedIn)",
  "Organic Video":"video (YouTube)",
  "Referral":"link from another site",
  "Email":"email link",
  "Paid Search":"paid search ad",
  "Paid Social":"paid social ad",
  "Display":"banner ad",
  "Affiliates":"affiliate link",
  "Unassigned":"source unknown (tracking gap)",
  "AI Assistant":"AI tool (ChatGPT, etc.)"
};
function channelLegend(names){
  var seen={},out=[];
  (names||[]).forEach(function(n){if(n&&!seen[n]&&CHANNEL_DEF[n]){seen[n]=1;out.push("<b>"+esc(n)+"</b> "+esc(CHANNEL_DEF[n]));}});
  if(!out.length)return "";
  return '<div class="foot">'+out.join(" · ")+' &nbsp;·&nbsp; n = sessions · % = engagement rate</div>';
}
/* A2 (Verona Aug 24): a plain colour-dot key for the engagement bars. */
function benchDot(color){return '<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+color+';vertical-align:middle;margin-right:6px"></span>';}
function benchLegend(){
  return '<div class="foot" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'+
    '<span>'+benchDot("var(--lime)")+'clears the '+IB.engRate.lo+'–'+IB.engRate.hi+'% benchmark</span>'+
    '<span>'+benchDot("var(--sage)")+'under the '+IB.engRate.lo+'–'+IB.engRate.hi+'% benchmark</span>'+
    '</div>';
}
function earliestISO(){var min=null;["ga4","clarity","linkedin","hubspot"].forEach(function(src){var raw=RAW[src];if(!raw||!Array.isArray(raw.rows))return;raw.rows.forEach(function(r){var d=rowDate(r);if(d&&(!min||d<min))min=d;});});return min||shiftISO(todayISO(),-89);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function full(v){return (v==null)?"—":"$"+Math.round(v).toLocaleString("en-US");}
function money(v){if(v==null)return "—";if(Math.abs(v)>=1e6)return "$"+(v/1e6).toFixed(2)+"M";if(Math.abs(v)>=1000)return "$"+Math.round(v/1000)+"k";return "$"+Math.round(v);}
/* Verona Aug 31: strip Meg's developer traffic (overview.php and other .php / dev / CMS URLs)
   out of the analytics — those page views aren't real site traffic. */
function isDevPath(p){p=String((p&&(p.path||p.landing_page||p.page))||p||"").toLowerCase();

/* Plain, consistent line key on EVERY chart (Henry Sep 2) — green line, grey band, dashed
   trend/benchmark — so no one guesses what a colour means. Terse by design. */
function chartKey(opts){
  opts=opts||{};

  var it=[sw('height:3px;background:var(--lime);border-radius:2px')+'This period',
          sw('height:10px;background:var(--track);border-radius:2px')+'Usual range'];
  if(opts.trendline)it.push(sw('height:0;border-top:2px dashed var(--teal)')+'Trend');
  if(opts.benchmark!=null)it.push(sw('height:0;border-top:2px dashed var(--teal)')+'Benchmark');

    it.map(function(x){return '<span style="display:inline-flex;align-items:center;white-space:nowrap">'+x+'</span>';}).join('')+'</div>';
}
function trend(series,opts){
  opts=opts||{};
  var pts=series.filter(function(s){return s.v!=null;});
  if(pts.length<2)return null;
  var w=780,h=210,pl=46,pr=16,pt=18,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  var vs=pts.map(function(p){return p.v;});
  var mean=vs.reduce(function(a,b){return a+b;},0)/vs.length;
  var sdv=Math.sqrt(vs.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/vs.length);
  var lo=mean-sdv,hi=mean+sdv;
  var all=vs.concat(opts.benchmark!=null?[opts.benchmark,lo,hi]:[lo,hi]);
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),spn=(mx-mn)||1;
  mn-=spn*.1;mx+=spn*.1;spn=mx-mn;
  /* clamp the axis floor at 0 for non-negative data (no "-6 sessions" from padding) */
  if(Math.min.apply(null,vs)>=0&&mn<0){mn=0;spn=(mx-mn)||1;}
  var n=series.length;
  function px(i){return pl+(n<=1?0:i/(n-1)*iw);}
  function py(v){return pt+ih-(v-mn)/spn*ih;}
  var s='<rect class="bnd" x="'+pl+'" y="'+py(hi)+'" width="'+iw+'" height="'+Math.max(py(lo)-py(hi),1)+'"/>';
  /* gridlines + Y-AXIS NUMBERS (Verona Aug 24 B1/C1 — every trend chart shows its scale) */
  function axfmt(v){return opts.fmt?opts.fmt(Math.round(v)):num(Math.round(v));}
  for(var g=0;g<=3;g++){var yy=pt+ih*g/3;s+='<line class="gl" x1="'+pl+'" y1="'+yy+'" x2="'+(w-pr)+'" y2="'+yy+'"/>';
    var gv=mn+(1-g/3)*spn;
    s+='<text class="axy" x="'+(pl-6)+'" y="'+(yy+3)+'" text-anchor="end">'+esc(axfmt(gv))+'</text>';
  }
  /* optional prior-period overlay (Verona Aug 24 B2 — see whether the new site is moving) */
  if(opts.prior&&opts.prior.length){
    var pd='',pst=false;
    opts.prior.forEach(function(v,i){if(v==null||i>=n)return;pd+=(pst?"L":"M")+px(i)+" "+py(v);pst=true;});
    if(pd)s+='<path d="'+pd+'" fill="none" stroke="var(--taupe)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>';
  }
  if(opts.benchmark!=null){
    s+='<line class="bmk" x1="'+pl+'" y1="'+py(opts.benchmark)+'" x2="'+(w-pr)+'" y2="'+py(opts.benchmark)+'"/>';
    s+='<text class="axl" x="'+(w-pr-4)+'" y="'+(py(opts.benchmark)-4)+'" text-anchor="end" fill="var(--teal)">'+esc(opts.benchmarkLabel||"target")+'</text>';
  }
  var d='',started=false;
  series.forEach(function(p,i){if(p.v==null)return;d+=(started?"L":"M")+px(i)+" "+py(p.v);started=true;});
  s+='<path class="ln" d="'+d+'"/>';
  if(opts.trendline){ /* dashed linear-regression line showing overall direction */
    var xis=[],yis=[];
    series.forEach(function(p,i){if(p.v!=null){xis.push(i);yis.push(p.v);}});
    if(xis.length>=2){
      var mxx=_mean(xis),myy=_mean(yis),nu=0,de=0;
      for(var k=0;k<xis.length;k++){nu+=(xis[k]-mxx)*(yis[k]-myy);de+=(xis[k]-mxx)*(xis[k]-mxx);}
      var bb=de?nu/de:0, aa=myy-bb*mxx, x0=xis[0], x1=xis[xis.length-1];
      s+='<line x1="'+px(x0)+'" y1="'+py(aa+bb*x0)+'" x2="'+px(x1)+'" y2="'+py(aa+bb*x1)+'" stroke="var(--teal)" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>';
    }
  }
  var last=(function(){for(var i=series.length-1;i>=0;i--)if(series[i].v!=null)return i;return -1;})();
  if(last>=0){
    s+='<circle class="dt" cx="'+px(last)+'" cy="'+py(series[last].v)+'" r="4"/>';
    s+='<text class="vl" x="'+px(last)+'" y="'+(py(series[last].v)-11)+'" text-anchor="end">'+
      (opts.fmt?opts.fmt(series[last].v):num(series[last].v))+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/7));
  for(var t=0;t<n;t+=step)s+='<text class="axl" x="'+px(t)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(series[t].label)+'</text>';
  /* per-point data so a shared hover handler can show the true number on any chart */
  var HP=[];
  series.forEach(function(p,i){
    if(p.v==null)return;
    var pr=(opts.prior&&opts.prior[i]!=null)?opts.prior[i]:null;
    HP.push({x:+px(i).toFixed(1),y:+py(p.v).toFixed(1),l:series[i].label,
      vt:(opts.fmt?opts.fmt(p.v):num(p.v)),
      pt:(pr!=null?(opts.fmt?opts.fmt(pr):num(pr)):null),
      py:(pr!=null?+py(pr).toFixed(1):null)});
  });
  var meta=' data-hp="'+encodeURIComponent(JSON.stringify(HP))+'" data-top="'+pt+'" data-bot="'+(pt+ih)+'"'+
    (opts.hoverName?' data-name="'+esc(opts.hoverName)+'"':'');
  return {svg:'<svg class="cv" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"'+meta+'>'+s+'<g class="hovg"></g></svg>'+chartKey(opts),lo:lo,hi:hi,last:pts[pts.length-1]};
}

/* ---------- HubSpot range maths ----------
   HubSpot history is a series of daily POINT-IN-TIME snapshots, not a transaction
   log. Two metric types therefore need opposite treatment:

   POINT-IN-TIME (open_pipeline, n_open, influenced contacts) — a range total is
   meaningless. Report the latest value plus its change since the earliest row in
   range. Never sum.

   CUMULATIVE (won_amount, lost_amount, n_won, n_lost) — these accumulate, so the
   value *within* a range is latest − earliest. Summing 30 snapshots of a $1.18M
   cumulative total would give ~$35M, and it would look entirely plausible on a
   chart. That is the failure this function exists to prevent.
*/
function hsRange(){
  var rows=HIST.hubspot;
  var live=(S.sources.hubspot&&S.sources.hubspot.data)||{};
  var out={
    rows:rows||null, days:rows?rows.length:0, ranged:false,
    latest:live.pipeline||{}, campaigns:live.campaigns||[],
    open:null, open_delta:null,
    won:null, lost:null, n_won:null, n_lost:null, cumulative:true,
    infl:null, infl_delta:null, label:"all time"
  };
  var pl=out.latest;
  out.open=pl.open_pipeline!=null?pl.open_pipeline:null;
  out.won=pl.won_amount!=null?pl.won_amount:null;
  out.lost=pl.lost_amount!=null?pl.lost_amount:null;
  out.n_won=pl.n_won!=null?pl.n_won:null;
  out.n_lost=pl.n_lost!=null?pl.n_lost:null;
  out.infl=(out.campaigns||[]).reduce(function(a,c){
    return a+((c.metrics&&c.metrics.influencedContacts)||0);},0);

  if(!rows||rows.length<2)return out;   /* not enough history — leave as all-time */

  var first=rows[0], last=rows[rows.length-1];
  var fp=first.pipeline||{}, lp=last.pipeline||{};

  out.ranged=true;
  out.label=(MODE==="custom")?(fmtDay(WIN.start)+" – "+fmtDay(WIN.end)):("last "+DAYS+" days");
  out.span=first.date+" → "+last.date;

  /* point-in-time: latest wins, delta is informational */
  if(lp.open_pipeline!=null){
    out.open=lp.open_pipeline;
    if(fp.open_pipeline!=null)out.open_delta=lp.open_pipeline-fp.open_pipeline;
  }
  var fi=(first.campaigns||[]).reduce(function(a,c){
    return a+((c.metrics&&c.metrics.influencedContacts)||0);},0);
  var li=(last.campaigns||[]).reduce(function(a,c){
    return a+((c.metrics&&c.metrics.influencedContacts)||0);},0);
  out.infl=li; out.infl_delta=li-fi;

  /* cumulative: subtract, never sum */
  function delta(a,b){return (a!=null&&b!=null)?(a-b):null;}
  var wD=delta(lp.won_amount,fp.won_amount), lD=delta(lp.lost_amount,fp.lost_amount);
  var nwD=delta(lp.n_won,fp.n_won), nlD=delta(lp.n_lost,fp.n_lost);

  /* a zero delta across the whole range means nothing closed in it — that is a
     real answer, not missing data. Only fall back to all-time if the field is absent. */
  /* Cumulative totals can only rise. A negative delta means the rows are out of
     order or the feed reset — either way the range figure is not trustworthy, so
     fall back to all-time and say so rather than printing a negative revenue. */
  var negative=(wD!=null&&wD<0)||(lD!=null&&lD<0)||(nwD!=null&&nwD<0)||(nlD!=null&&nlD<0);
  if(negative){
    out.suspect=true;
    return out;
  }
  if(wD!=null||lD!=null){
    out.cumulative=false;
    out.won=wD; out.lost=lD; out.n_won=nwD; out.n_lost=nlD;
  }
  return out;
}
function deltaTxt(v,fmt){
  if(v==null)return "";
  var ref=(MODE==="custom")?("vs "+fmtDay(WIN.start)):("vs "+DAYS+"d ago");
  if(v===0)return "no change "+ref;
  return (v>0?"↑ ":"↓ ")+(fmt?fmt(Math.abs(v)):num(Math.abs(v)))+" "+ref;
}

/* Clarity's live metrics{} nests each figure ({scroll_depth:{averageScrollDepth},
   rage_clicks:{sessionsWithMetricPercentage,...}, traffic:{totalSessionCount,...}, ...})
   and some values arrive as strings. The synthetic preview shape is already flat.
   Normalise BOTH to flat numbers so KPIs and the trend line never receive an object. */
function claritySize(mo){
  if(!mo||typeof mo!=="object")return mo;
  function pick(o,k){
    if(o==null)return null;
    if(typeof o==="object"){var n=Number(o[k]);return (n===n)?n:null;}
    var f=Number(o);return (f===f)?f:null;
  }
  return {
    scroll_depth:     pick(mo.scroll_depth,"averageScrollDepth"),
    rage_clicks:      pick(mo.rage_clicks,"sessionsWithMetricPercentage"),
    dead_clicks:      pick(mo.dead_clicks,"sessionsWithMetricPercentage"),
    quickback_clicks: pick(mo.quickback_clicks,"sessionsWithMetricPercentage"),
    script_errors:    pick(mo.script_errors,"sessionsWithMetricPercentage"),
    traffic:          pick(mo.traffic,"totalSessionCount"),
    engagement_time:  pick(mo.engagement_time,"activeTime")
  };
}

/* Clarity reports a bot-vs-human split on its tracked window: metrics.traffic carries
   totalSessionCount (human) and totalBotSessionCount, and the "Traffic" slice of each
   dimension list (channel_country, os_browser_device) carries the same split per bucket.
   Headline totals come from metrics.traffic (authoritative); the dimension slices are used
   only for the "where do the bots concentrate" callout. Returns null unless BOTH session
   counts are present and numeric, so older snapshots without a bot count skip the panel. */
function clarityTraffic(c){
  if(!c||mode(c)!=="live")return null;
  var d=c.data||{}, tr=(d.metrics&&d.metrics.traffic)||null;
  if(!tr||typeof tr!=="object")return null;
  var real=Number(tr.totalSessionCount), bot=Number(tr.totalBotSessionCount);
  if(real!==real||bot!==bot)return null;
  function slice(list){var out=null;(Array.isArray(list)?list:[]).forEach(function(e){if(e&&e.metricName==="Traffic")out=e.information||[];});return out||[];}
  var dim=d.dimensions||{};
  var buckets=slice(dim.channel_country).map(function(r){
    return {label:(r.Channel||"?")+" · "+(r.Country||"?"),real:Number(r.totalSessionCount)||0,bot:Number(r.totalBotSessionCount)||0};
  }).sort(function(a,b){return b.bot-a.bot;});
  var botDevices=slice(dim.os_browser_device).map(function(r){
    return {label:[r.OS,r.Browser,r.Device].filter(Boolean).join(" "),real:Number(r.totalSessionCount)||0,bot:Number(r.totalBotSessionCount)||0};
  }).filter(function(x){return x.bot>0&&x.real===0;}).sort(function(a,b){return b.bot-a.bot;});
  var total=real+bot;
  return {real:real,bot:bot,total:total,share:total?(bot/total*100):0,buckets:buckets,botDevices:botDevices,window_days:d.window_days||null};
}

/* A5: sum Clarity human/bot over the currently-selected date window from our stored
   history, so this panel uses the SAME timeframe as every other widget on screen
   (previously it showed only Clarity's single latest 1-day window). Dedups to one row
   per day, keeping the freshest pull. Returns null when no stored day falls in the window. */
function clarityWindow(){
  if(!RAW.clarity||!Array.isArray(RAW.clarity.rows))return null;
  var byd={};
  RAW.clarity.rows.forEach(function(r){
    if(!(r&&r.data&&r.data.mode==="live"&&r.data.metrics&&r.data.metrics.traffic))return;
    var tr=r.data.metrics.traffic;
    if(tr.totalSessionCount==null||tr.totalBotSessionCount==null)return;
    var d=r.date||(r.pulled_at||"").slice(0,10);
    if(!d||d<WIN.start||d>WIN.end)return;
    var cur=byd[d];
    if(!cur||newer(r.pulled_at,cur.pulled_at))byd[d]={pulled_at:r.pulled_at,human:Number(tr.totalSessionCount)||0,bot:Number(tr.totalBotSessionCount)||0};
  });
  var keys=Object.keys(byd);
  if(!keys.length)return null;
  var real=0,bot=0;
  keys.forEach(function(k){real+=byd[k].human;bot+=byd[k].bot;});
  return {real:real,bot:bot,total:real+bot,days:keys.length};
}
/* Clarity human/bot summed over an EXPLICIT [s,e] window — used for the headline cards and
   their period-over-period comparison (prior window). Same dedup rule as clarityWindow(). */
function clarityRange(s,e){
  if(!RAW.clarity||!Array.isArray(RAW.clarity.rows))return null;
  var byd={};
  RAW.clarity.rows.forEach(function(r){
    if(!(r&&r.data&&r.data.mode==="live"&&r.data.metrics&&r.data.metrics.traffic))return;
    var tr=r.data.metrics.traffic;
    if(tr.totalSessionCount==null||tr.totalBotSessionCount==null)return;
    var d=r.date||(r.pulled_at||"").slice(0,10);
    if(!d||d<s||d>e)return;
    var cur=byd[d];
    if(!cur||newer(r.pulled_at,cur.pulled_at))byd[d]={pulled_at:r.pulled_at,human:Number(tr.totalSessionCount)||0,bot:Number(tr.totalBotSessionCount)||0};
  });
  var keys=Object.keys(byd);if(!keys.length)return null;
  var real=0,bot=0;keys.forEach(function(k){real+=byd[k].human;bot+=byd[k].bot;});
  return {real:real,bot:bot,total:real+bot,days:keys.length};
}

/* Average Clarity's behaviour metrics (scroll depth, rage/dead/quick-back %, active
   engagement, script errors) over the windowed stored days, so the Behaviour card moves
   with the date filter instead of showing only the latest single day's snapshot. These are
   per-session percentages/seconds, so the daily mean is the right roll-up. `hist` is the
   already-windowed HIST.clarity (one row per day in range). Returns null if empty. */
function clarityAgg(hist){
  if(!hist||!hist.length)return null;
  var keys=["scroll_depth","rage_clicks","dead_clicks","quickback_clicks","script_errors","engagement_time"];
  var acc={};keys.forEach(function(k){acc[k]=[];});
  hist.forEach(function(x){
    var m=claritySize(x.metrics||x);
    keys.forEach(function(k){var v=m[k];if(v!=null&&!isNaN(v))acc[k].push(Number(v));});
  });
  function avg(a){return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:null;}
  var out={days:hist.length};keys.forEach(function(k){out[k]=avg(acc[k]);});
  return out;
}

  /* ---------- Traffic quality (Clarity human vs bot) ---------- */
  var ct=(!PV)?clarityTraffic(c):null;

    /* CONTEXT (moved here from Insights Aug 31): why GA4 and Clarity counts differ so much —

    h+='<div class="card" style="margin-top:12px;border-color:#BFDBD6;background:var(--tealb)"><div class="ch" style="border-color:#CFE3DF"><h3 style="color:var(--teal)">How to read GA4 vs Clarity</h3><span class="note">different tools, not conflicting numbers</span></div><div class="cb">'+

      'We keep GA4 for the deeper <b>channel, landing-page and top-page</b> detail below. The two aren\'t meant to match — GA4 is the fuller count, Clarity is the bot-filtered one.</p>'+
      '</div></div>';
    var qReal=cw?cw.real:(ct?ct.real:0), qBot=cw?cw.bot:(ct?ct.bot:0), qTot=qReal+qBot;
    var topB=(ct&&ct.buckets[0])||null;
    var win=cw?winDesc():(ct&&ct.window_days?("last "+ct.window_days+(ct.window_days===1?" day":" days")):"latest window");
    var devTxt=(ct&&ct.botDevices.length)?ct.botDevices.slice(0,2).map(function(x){return x.label;}).join(", "):"";
    h+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Human vs bot traffic · Clarity</h3>'+

      '</div>'+
      ((CB.engagement_time!=null||cw||ct||(cm&&cm.traffic!=null))?

        (CB.engagement_time!=null?'<tr><td>Active engagement</td><td class="n">'+Math.round(CB.engagement_time)+'s'+(cAgg?' <span style="color:var(--mute);font-size:10px">avg/day</span>':'')+'</td></tr>':'')+

/* ================= BLOG ================= */
/* Blog posts now live at hd-innovations.com/resources/[title] (team decision Aug 17; Meg+Adrian shipped the
   permalink + redirects). Historical GA4 rows still carry the old root-level slugs, so isBlogPath
   accepts BOTH /resources/[slug] and legacy root content slugs, excluding nav pages and taxonomy.
   Ranked by sessions from the windowed landing_pages; links resolve to the canonical /resources/ URL. */
function blog(){
  var g=S.sources.ga4,h='';
  var agg=(!PV&&HIST.ga4_agg)||null;
  var tp=agg?agg.top_pages:((!PV&&g.data&&g.data.top_pages)||[]);
  var lp=(agg&&agg.landing_pages)||[];
  /* Verona Aug 31 — the blog tab is built from GA4's per-post (landing_page) data, which began
     accruing LATER than overall site traffic. Show the real coverage span (so the tab visibly
     responds to the date range within available data) and note when per-post tracking started,
     so a wide range that shows the same posts reads as "all we have yet," not a broken filter. */
  var lpCov=(agg&&agg.lp_start)?{start:agg.lp_start,end:agg.lp_end,days:agg.lp_ndays}:null;
  var blogStart=null;
  if(!PV&&RAW.ga4&&Array.isArray(RAW.ga4.rows))RAW.ga4.rows.forEach(function(r){var dd=r.data||{};if(dd.mode==="stub")return;(dd.landing_pages||[]).forEach(function(x){if(x.date&&(!blogStart||x.date<blogStart))blogStart=x.date;});});
  var span=(!PV)?(lpCov?(fmtDay(lpCov.start)+" – "+fmtDay(lpCov.end)):winDesc()):"sample window";
  function norm(s){var p=(typeof s==="string"?s:(s&&(s.path||s.landing_page||s.page)||""));return p.replace(/[?#].*$/,"").replace(/\/$/,"")||"/";}
  var SITE=["/","/careers","/services","/services-new","/about-us","/about","/contact","/why-hdi","/health-systems","/payers","/solutions","/team","/leadership","/privacy","/privacy-policy","/terms","/test-page","/home-new","/overview","/case-studies","/resources","/cms"];
  function isBlogPath(pth){
    var p=norm(pth);
    if(p==="/"||p==="/resources"||p==="/blog")return false;
    if(p.indexOf("/resources/")===0||p.indexOf("/blog/")===0)return true;  /* /resources/ (new) or /blog/ (transitional) */
    if(p.indexOf("/category/")===0||p.indexOf("/tag/")===0)return false;  /* taxonomy */
    if(/\.php$/.test(p))return false;                       /* legacy site */
    if(p.indexOf("/cms/")===0||/\/member_id$/.test(p))return false;
    if(SITE.indexOf(p)>=0)return false;
    return p.split("/").length===2 && p.length>1;           /* legacy root content slug */
  }
  function blogURL(pth){var p=norm(pth);if(p.indexOf("/resources/")===0||p.indexOf("/blog/")===0)return SITE_URL+p;return SITE_URL+"/resources/"+p.replace(/^\//,"");}
  function title(pth){var p=norm(pth).replace(/^\/(resources|blog)\//,"").replace(/^\//,"");if(!p)return "(home)";p=p.replace(/-/g," ");return p.charAt(0).toUpperCase()+p.slice(1);}
  function blogLink(pth){return '<a href="'+esc(blogURL(pth))+'" target="_blank" rel="noopener" style="color:var(--teal);border-bottom:1px solid var(--sage);text-decoration:none">'+esc(title(pth))+'</a>';}
  /* D1: truncate at a word boundary (no mid-word cut). D2/D3: suppress engagement % on tiny samples. */
  function shortTitle(pth,max){var t=title(pth);if(t.length<=max)return t;var cut=t.slice(0,max);var sp=cut.lastIndexOf(" ");return (sp>10?cut.slice(0,sp):cut)+"…";}
  var ER_MIN=5; /* below this many sessions, an engagement rate isn't meaningful */
  function erTxt(x){return num(x.sessions)+(x.sessions>=ER_MIN?" · "+x.er+"% eng":" · too few to rate");}

  var posts=lp.filter(function(x){return isBlogPath(x.landing_page)&&!isDevPath(x.landing_page);})
    .map(function(x){return {path:x.landing_page,sessions:x.sessions||0,er:x.er||0};})
    .sort(function(a,b){return b.sessions-a.sessions;});
  var hub=tp.filter(function(x){return norm(x)==="/resources";})[0]||null;
  var totalSess=posts.reduce(function(a,x){return a+x.sessions;},0);
  var top=posts[0]||null;

  h+='<div class="card"><div class="cb">'+
    '<div style="font-family:var(--m);font-size:11px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase">Blog · thought leadership</div>'+
    '<h3 style="font-size:22px;letter-spacing:-.02em;margin:6px 0 4px;color:var(--ink)">Blog performance</h3>'+
    '<p class="sub" style="margin:0">Which posts are gaining traction — the leading signal for thought leadership. <b>'+esc(span)+'</b>, by Google Analytics sessions. Posts live at <code>hd-innovations.com/resources/[title]</code>.</p>'+
    (blogStart?'<div class="foot" style="margin:8px 0 0">Per-post tracking began <b>'+esc(fmtDay(blogStart))+'</b> — earlier than that, GA4 has site totals but not per-post detail, so a wider date range won\'t reach further back until more history builds. Within that window the tab re-scopes with the date filter.</div>':"")+
    '<div class="kpis" style="margin-top:14px">'+
      kpi("POSTS WITH TRAFFIC",String(posts.length),"individual posts tracked this range",null,mix(sp(),{hi:true}))+
      kpi("TOTAL BLOG SESSIONS",num(totalSess),"across all posts in range",null,sp())+
      kpi("TOP POST",top?esc(shortTitle(top.path,26)):"—",top?num(top.sessions)+" sessions":"no post traffic in range",null,sp())+
      kpi("RESOURCES HUB VIEWS",hub?num(hub.views):"—","/resources — the page listing all posts",null,sp())+
    '</div>'+srcTag(g,"GA4")+'</div></div>';

  if(posts.length){
    var pmax=posts[0].sessions||1;
    h+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Top blog posts — what\'s performing</h3><span class="note">'+esc(span)+' · bar = sessions · % = engagement rate · click to open</span>'+srcTag(g,"GA4")+'</div><div class="cb">'+
      bars(posts.slice(0,15).map(function(x,i){return [title(x.path),x.sessions,i===0?"var(--lime)":"var(--sage)",erTxt(x),null,"",blogLink(x.path)];}),pmax)+
      '<div class="foot" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'+benchDot("var(--lime)")+'top post by traffic&nbsp;&nbsp;'+benchDot("var(--sage)")+'other posts</div>'+
      '<div class="foot">Ranked by sessions over '+esc(span)+' — the posts earning the most attention are the ones to amplify and build follow-ups around. The <b>engagement rate is the live figure for this date range</b> (recomputed from the freshest data each time, never a stored snapshot). Click any post to open it.</div>'+
      '</div></div>';

    /* worst / lowest-traction, for "what's not working" */
    if(posts.length>3){
      var lowest=posts.slice().sort(function(a,b){return a.sessions-b.sessions;}).slice(0,5);
      h+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Lowest-traffic posts</h3><span class="note">'+esc(span)+' · fewest sessions</span>'+srcTag(g,"GA4")+'</div><div class="cb">'+
        bars(lowest.map(function(x){return [title(x.path),x.sessions,"var(--taupe)",erTxt(x),null,"",blogLink(x.path)];}),pmax)+
        '<div class="foot">Ranked by <b>traffic</b> (sessions), not engagement — at these small sample sizes the engagement percentages are too close to separate meaningfully (a 0% on a 3-visitor post is a data artifact, not a real result), so treat them as "not enough traffic yet" rather than "worst posts." Low traffic can mean a weak topic, thin distribution, or an older post fading.</div>'+
        '</div></div>';
    }
  } else {
    h+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Top blog posts</h3>'+srcTag(g,"GA4")+'</div><div class="cb">'+
      empty("No blog-post traffic in this range","Widen the date filter, or check that the /resources/[title] permalinks and redirects are fully live in GA4.")+
      '</div></div>';
  }

  h+='<div class="card" style="margin-top:12px"><div class="cb"><div class="foot" style="margin:0">Blog posts are matched on the <code>hd-innovations.com/resources/[title]</code> path (plus legacy root-slug posts still in GA4 history), excluding nav pages, category and tag archives. As older posts finish redirecting to <code>/resources/</code>, the match gets cleaner automatically.</div></div></div>';

  $("p-blog").innerHTML=h;
}
function building(src,n){

/* ================= LINKEDIN ================= */
/* V1 manual upload with ACCUMULATING HISTORY. Reads /data/linkedin.json (schema 2): `seed_trends`
   is the historical backfill from the exec deck; `uploads[]` is one entry per manual monthly export
   and is RETAINED forever. Trends = seed + every upload, so followers / engagement / impressions
   extend with real data each month, and every post is archived so individual post performance is
   kept over time. To add a month, append one object to `uploads` — never replace the array. */
function linkedin(){
  var h='', L=LI;
  var ups=(L&&L.uploads)||[];
  if(!L||!ups.length){
    h='<div class="card"><div class="ch"><h3>LinkedIn</h3>'+tag("none","Manual upload")+'</div><div class="cb">'+
      empty("No LinkedIn export loaded yet","LinkedIn is a manual upload for V1. Add an export to <code>/data/linkedin.json</code> (in <code>uploads[]</code>) and this tab fills in.")+
      '</div></div>';
    $("p-li").innerHTML=h;return;
  }
  var cur=ups[ups.length-1];
  var seed=L.seed_trends||{}, B=L.benchmark||{};
  var P=cur.profile||{}, F=cur.followers||{}, posts=(cur.posts||[]).slice();
  function o(x){return x||{};}
  function dpct(x){x=o(x);if(x.delta==null)return "";var v=x.delta;return (v>0?"↑ +":(v<0?"↓ ":"→ "))+Math.abs(v)+"%";}
  function dcls(x){x=o(x);if(x.delta==null||x.delta===0)return {};return x.delta>0?{ok:true}:{warn:true};}
  function ser(arr){return (arr||[]).map(function(p){return {label:p[0],v:p[1]};});}
  /* Verona Aug 31: LinkedIn now responds to the top date range instead of being hardcoded to
     Aug 2024→today. Month labels ("Aug '24","Sep",…) are parsed to real dates with a rolling year,
     then filtered to WIN. LinkedIn data is MONTHLY, so a window narrower than ~2 months can't be
     subdivided — in that case we show all available months and say so, rather than blanking. */
  var _MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  function labelDate(label,prev){
    var s=String(label).toLowerCase();
    var mm=s.match(/([a-z]{3})/), mi=mm?_MON[mm[1]]:(prev?prev.mi:0);
    var yy=s.match(/'?\s?(\d{2})\b/), year;
    if(yy)year=2000+parseInt(yy[1],10);
    else if(prev){year=prev.year;if(mi!=null&&mi<prev.mi)year++;}
    else year=2024;
    if(mi==null)mi=0;
    return {year:year,mi:mi,iso:year+"-"+("0"+(mi+1)).slice(-2)+"-15"};
  }
  function winMonths(arr){
    arr=arr||[];
    if(arr.length<2)return {series:ser(arr),full:true,span:""};
    var prev=null, dated=arr.map(function(p){var d=labelDate(p[0],prev);prev=d;return {label:p[0],v:p[1],iso:d.iso};});
    if(PV||!WIN.start||!WIN.end)return {series:dated,full:true,span:""};
    var win=dated.filter(function(d){return d.iso>=WIN.start&&d.iso<=WIN.end;});
    if(win.length>=2)return {series:win,full:false,span:win[0].label+" – "+win[win.length-1].label};
    return {series:dated,full:true,span:""};
  }
  var liNarrow=false;  /* set true when any series had to fall back to all-months for a short window */
  function winNote(w){if(w.full&&!PV&&WIN.start){liNarrow=true;return ' · showing all months (range too short for monthly data)';}return w.span?(' · '+esc(w.span)):'';}
  var period=esc(cur.period||"the reporting period");
  var upTag='<span class="tag stub" style="white-space:nowrap">Manual upload · '+period+'</span>';

  /* ---- HEADER + current-period highlights ---- */
  h+='<div class="card"><div class="cb">'+
    '<div style="font-family:var(--m);font-size:11px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase">HDI // LinkedIn Performance</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:6px 0 4px">'+
      '<h3 style="font-size:22px;letter-spacing:-.02em;margin:0;color:var(--ink)">The LinkedIn audience keeps growing.</h3>'+upTag+
    '</div>'+
    '<p class="sub" style="margin:0">From <b>181</b> followers when tracking began to <b>'+num(F.total)+'</b> today. Profile highlights are for <b>'+period+'</b>; each % is vs the prior period.</p>'+
    '<div class="kpis" style="margin-top:14px">'+
      kpi("IMPRESSIONS",num(o(P.impressions).value),dpct(P.impressions),"vs prior period",mix(sp(),dcls(P.impressions)))+
      kpi("REACTIONS",num(o(P.reactions).value),dpct(P.reactions),"vs prior period",mix(sp(),dcls(P.reactions)))+
      kpi("COMMENTS",num(o(P.comments).value),dpct(P.comments),"vs prior period",mix(sp(),dcls(P.comments)))+
      kpi("REPOSTS",num(o(P.reposts).value),dpct(P.reposts)||"no change","vs prior period",mix(sp(),{hi:true}))+
    '</div></div></div>';

  /* ---- Follower highlights ---- */
  h+='<div class="card" style="margin-top:12px"><div class="ch"><h3>Follower highlights</h3><span class="note">'+period+'</span>'+upTag+'</div><div class="cb"><div class="kpis">'+
    kpi("TOTAL FOLLOWERS",num(F.total),F.since_start_pct?("↑ +"+F.since_start_pct+"% since Aug ’24"):"the audience you’ve built",null,mix(sp(),{hi:true}))+
    kpi("NEW · LAST 30 DAYS",num(o(F.new_30d).value),dpct(F.new_30d),"vs prior period",mix(sp(),dcls(F.new_30d)))+
    kpi("AUTO-INVITED (PREMIUM)",num(o(F.auto_invited).value),dpct(F.auto_invited)||"no change","invited to follow via Premium",sp())+
    kpi("SEARCH APPEARANCES",num(o(F.search_appearances).value),dpct(F.search_appearances),esc(o(F.search_appearances).window||"in search results"),mix(sp(),dcls(F.search_appearances)))+
    '</div></div></div>';

  /* row renderer for post tables */

/* Transparent stats — every figure below is computed here from the live series, with
   sample size stated. Nothing is asserted as causal; correlations are labelled as such. */
function _sum(a){return a.reduce(function(x,y){return x+(y||0);},0);}
function _mean(a){return a.length?_sum(a)/a.length:0;}
function pearson(xs,ys){
  var n=Math.min(xs.length,ys.length);if(n<3)return null;
  var mx=_mean(xs.slice(0,n)),my=_mean(ys.slice(0,n)),sxy=0,sxx=0,syy=0;
  for(var i=0;i<n;i++){var dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  if(sxx===0||syy===0)return null;
  return sxy/Math.sqrt(sxx*syy);
}
function slopePerDay(ys){
  var n=ys.length;if(n<2)return null;var mx=(n-1)/2,my=_mean(ys),nu=0,de=0;
  for(var i=0;i<n;i++){nu+=(i-mx)*(ys[i]-my);de+=(i-mx)*(i-mx);}
  return de?nu/de:null;
}
function growthPct(cur,prev){return (prev&&prev>0)?((cur-prev)/prev*100):null;}
function pctTxt(v,dp){return v==null?"—":((v>0?"+":"")+v.toFixed(dp==null?0:dp)+"%");}

/* ---------- shared GA4 window maths (drives BOTH Insights and Website) ----------
   Everything is scoped to the selected date range WIN, and compared to the equal-length
   window immediately before it — so the range control up top drives these numbers, and
   "current vs prior" is always a like-for-like timeframe. */
var GA4_SESS_BENCH=158; /* Databox median session ~2m38s */
function ga4Window(){
  var full=(RAW.ga4&&Array.isArray(RAW.ga4.rows))?normHist({rows:RAW.ga4.rows},"ga4"):null;
  if(!full||!full.length)return null;
  var winLen=daysInclusive(WIN.start,WIN.end)||30;
  var pStart=shiftISO(WIN.start,-winLen), pEnd=shiftISO(WIN.start,-1);
  var cur=full.filter(function(d){return d.date>=WIN.start&&d.date<=WIN.end;});
  var pri=full.filter(function(d){return d.date>=pStart&&d.date<=pEnd;});
  function S(a,k){return a.reduce(function(x,d){return x+(d[k]||0);},0);}
  /* only compare when the prior window has comparable coverage — otherwise a window that
     reaches before our data start (e.g. 90d/All) divides by near-nothing and shows a
     meaningless +thousands%. */
  var o={full:full,cur:cur,pri:pri,winLen:winLen,hasPrior:(pri.length>=Math.max(2,Math.floor(cur.length*0.8))),curDates:{},
    s:S(cur,"sessions"),sp:S(pri,"sessions"),e:S(cur,"engaged"),ep:S(pri,"engaged"),
    u:S(cur,"total_users"),up:S(pri,"total_users"),es:S(cur,"engagement_seconds"),esp:S(pri,"engagement_seconds")};
  cur.forEach(function(d){o.curDates[d.date]=1;});
  o.mom=o.hasPrior?growthPct(o.s,o.sp):null;
  o.uMom=o.hasPrior?growthPct(o.u,o.up):null;

/* Each tab renders independently: a hiccup in one section can never blank the others or bubble
   up as a fake "cannot reach the pipeline" error. Failures are logged to the console for the
   team, never shown to viewers. */
function render(){[shell,board,insights,campaigns,pipeline,website,blog,linkedin,benchmarks].forEach(function(fn){try{fn();}catch(err){if(window.console&&console.error)console.error("[dashboard] section render skipped:",err);}});}

/* History shape (verified live):
   { source, days: <integer request param>, rows: [ { date, pulled_at, data: {...} } ] }
   Each row is a daily SNAPSHOT. Iterate rows; the payload is row.data.
   row.data.mode === "stub" means that date has no real data — skip it.
   GA4: the per-day series lives in row.data.days[]. Because GA4 pulls a rolling
   3-day window, the same date recurs across rows — dedupe by date, preferring a
   settled row over a provisional one, then the later pulled_at.
   Clarity: row.data.metrics is an OBJECT, so each row yields one point.
*/
function isStub(row){
  if(!row||!row.data)return true;
  if(row.data.mode==="stub")return true;
  return false;
}
function newer(a,b){return new Date(a||0).getTime()>new Date(b||0).getTime();}
function byDateSorted(map){
  /* Sort by real date value, not string order. ISO dates sort correctly either way,
     but a single non-padded date from the feed would silently reorder the series and
     make first/last wrong — which surfaces as a negative cumulative delta. */
  return Object.keys(map).sort(function(a,b){
    var ta=new Date(a).getTime(), tb=new Date(b).getTime();
    if(ta===ta&&tb===tb&&ta!==tb)return ta-tb;
    return a<b?-1:(a>b?1:0);
  }).map(function(k){return map[k];});
}

function normHist(payload,source){
  if(!payload||!Array.isArray(payload.rows))return null;
  var rows=payload.rows.filter(function(r){return !isStub(r);});
  if(!rows.length)return null;

  if(source==="ga4"){
    var keep={};
    rows.forEach(function(r){
      var arr=r.data.days;
      if(!Array.isArray(arr))return;
      arr.forEach(function(d){
        if(!d||!d.date)return;
        var cur=keep[d.date];
        if(!cur){keep[d.date]={d:d,pulled:r.pulled_at};return;}
        var curProv=!!cur.d.provisional, newProv=!!d.provisional;
        if(curProv&&!newProv){keep[d.date]={d:d,pulled:r.pulled_at};return;}
        if(curProv===newProv&&newer(r.pulled_at,cur.pulled)){keep[d.date]={d:d,pulled:r.pulled_at};}
      });
    });
    var days=byDateSorted(keep).map(function(x){return x.d;});
    return days.length?days:null;
  }

  if(source==="clarity"){
    var cm={};
    rows.forEach(function(r){
      var m=r.data.metrics;
      if(!m||!Object.keys(m).length)return;
      var dt=r.date||(r.pulled_at||"").slice(0,10);
      if(!dt)return;
      var cur=cm[dt];
      if(!cur||newer(r.pulled_at,cur.pulled_at))cm[dt]={date:dt,metrics:m,pulled_at:r.pulled_at};
    });
    var cl=byDateSorted(cm);
    return cl.length?cl:null;
  }

  if(source==="hubspot"){
    var hb={};
    rows.forEach(function(r){
      var dt=r.date||(r.pulled_at||"").slice(0,10);
      if(!dt)return;
      var cur=hb[dt];
      if(!cur||newer(r.pulled_at,cur.pulled_at)){
        hb[dt]={date:dt,pulled_at:r.pulled_at,
          pipeline:(r.data.pipeline||{}),campaigns:(r.data.campaigns||[]),
          contacts_created_7d:r.data.contacts_created_7d};
      }
    });
    var hbArr=byDateSorted(hb);
    return hbArr.length?hbArr:null;
  }

  /* linkedin — each row is one uploaded period */
  var lk={};
  rows.forEach(function(r){
    var d=r.data||{};
    var dt=(d.period&&d.period.end)||r.date;
    if(!dt)return;
    var cur=lk[dt];
    if(!cur||newer(r.pulled_at,cur.pulled_at)){
      lk[dt]={date:dt,period:d.period,pulled_at:r.pulled_at,
        followers_total:d.followers_total,followers_gained:d.followers_gained,
        engagement_rate:d.engagement_rate,impressions:d.impressions,
        unique_visitors:d.unique_visitors,data:d};
    }
  });
  var li=byDateSorted(lk);
  return li.length?li:null;
}

/* GA4 channels and top_pages aggregated across the selected range,
   deduped on the same date+key basis so overlapping snapshots don't double-count. */
function aggGA4(payload){
  if(!payload||!Array.isArray(payload.rows))return null;
  var ch={},pg={},lp={};
  payload.rows.filter(function(r){return !isStub(r);}).forEach(function(r){
    (r.data.channels||[]).forEach(function(x){
      if(!x||!x.channel||!x.date)return;
      var k=x.date+"|"+x.channel, cur=ch[k];
      if(!cur||newer(r.pulled_at,cur.pulled_at))ch[k]={row:x,pulled_at:r.pulled_at};
    });
    /* landing_pages IS dated (landing_page × day), so it windows like channels: dedup by
       date+page keeping the freshest pull, then sum over the range. */
    (r.data.landing_pages||[]).forEach(function(x){
      if(!x||!x.landing_page||!x.date)return;
      var k=x.date+"|"+x.landing_page, cur=lp[k];
      if(!cur||newer(r.pulled_at,cur.pulled_at))lp[k]={row:x,pulled_at:r.pulled_at};
    });
    /* top_pages carries no date field, so it is a snapshot-level rollup rather than
       a daily row. Summing across snapshots would inflate it — take the latest only. */
    if(Array.isArray(r.data.top_pages)&&r.data.top_pages.length){
      if(!pg._at||newer(r.pulled_at,pg._at)){pg._at=r.pulled_at;pg._rows=r.data.top_pages;}
    }
  });
  var chTot={};
  Object.keys(ch).forEach(function(k){var x=ch[k].row;chTot[x.channel]=(chTot[x.channel]||0)+(x.sessions||0);});
  var chArr=Object.keys(chTot).map(function(k){return {channel:k,sessions:chTot[k]};})
    .sort(function(a,b){return b.sessions-a.sessions;});
  var lpTot={};
  Object.keys(lp).forEach(function(k){var x=lp[k].row;var p=x.landing_page;var o=lpTot[p]||(lpTot[p]={sessions:0,engaged:0});o.sessions+=(x.sessions||0);o.engaged+=(x.engaged||0);});
  var lpArr=Object.keys(lpTot).map(function(p){var o=lpTot[p];return {landing_page:p,sessions:o.sessions,engaged:o.engaged,er:o.sessions?Math.round(o.engaged/o.sessions*100):0};})
    .sort(function(a,b){return b.sessions-a.sessions;});
  var pgArr=(pg._rows||[]).slice().sort(function(a,b){return (b.views||0)-(a.views||0);});
  /* landing-page (per-post) date coverage — the blog tab is built from this, and it only started
     accruing on a later date than per-day sessions; expose the real span so the blog can show it. */
  var lpDates=Object.keys(lp).map(function(k){return k.split("|")[0];}).filter(Boolean);
  var lpDaySet={};lpDates.forEach(function(d){lpDaySet[d]=1;});
  var lpMin=lpDates.length?lpDates.reduce(function(a,b){return a<b?a:b;}):null;
  var lpMax=lpDates.length?lpDates.reduce(function(a,b){return a>b?a:b;}):null;
  return {channels:chArr,top_pages:pgArr,landing_pages:lpArr,pages_at:pg._at||null,lp_start:lpMin,lp_end:lpMax,lp_ndays:Object.keys(lpDaySet).length};
}

/* Fetch the full stored history ONCE (WIDE); the backend caps it to what exists.
   The date controls then re-window this cached data client-side — no refetch, and
   custom ranges that end in the past work because we already hold every day. */
function fetchHist(source){
  return fetch(API+"?history="+source+"&days="+WIDE,{cache:"no-store"})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){RAW[source]=(j&&Array.isArray(j.rows))?j:null;})
    .catch(function(){RAW[source]=null;});
}

/* Filter every source's raw rows to the selected [start,end] window, then run the
   existing normalisers on the trimmed set. All the inflation-safe range maths
   (hsRange latest−earliest, aggGA4 dedupe) operate unchanged on the filtered rows. */
function inWin(r){var d=rowDate(r);return d&&d>=WIN.start&&d<=WIN.end;}
function applyWindow(){
  ["ga4","clarity","linkedin","hubspot"].forEach(function(src){
    var raw=RAW[src];
    if(!raw){HIST[src]=null;if(src==="ga4")HIST.ga4_agg=null;return;}
    var f={rows:raw.rows.filter(inWin)};
    HIST[src]=normHist(f,src);
    if(src==="ga4")HIST.ga4_agg=aggGA4(f);
  });
  DAYS=daysInclusive(WIN.start,WIN.end);
  syncControls();
  if(S)render();
}

/* Preset windows always end today. "All" (n=0) spans the earliest stored day. */
function setPreset(n){
  MODE="preset";LASTPRESET=n;
  WIN.end=todayISO();
  WIN.start=(n>0)?shiftISO(WIN.end,-(n-1)):earliestISO();
}

/* Reflect current window in the date inputs, preset highlight, and readout pill. */
function syncControls(){
  var earliest=earliestISO(), t=todayISO();
  var f=$("drFrom"), to=$("drTo");
  if(f&&to){
    f.min=earliest;f.max=t;to.min=earliest;to.max=t;
    f.value=WIN.start||"";to.value=WIN.end||"";
  }
  var span=daysInclusive(WIN.start,WIN.end);
  Array.prototype.forEach.call($("rangeSeg").children,function(b){
    var d=+b.dataset.d, on=false;
    if(MODE==="preset"&&WIN.end===t){
      on=(d===0)?(WIN.start===earliest):(d===span);
    }
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  var rn=$("rangeNow");
  if(rn)rn.textContent="Showing "+fmtDay(WIN.start)+" – "+fmtDay(WIN.end)+" · "+span+"d";
  validateApply();
}

function validateApply(){
  var a=$("drApply");if(!a)return;
  var f=$("drFrom").value, to=$("drTo").value;
  a.disabled=!(f&&to&&f<=to);
}

function load(){
  $("feedTxt").textContent="Loading…";
  Promise.all([
    fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("feed "+r.status);return r.json();}),
    fetch(BM_URL,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(LI_URL,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    S=res[0];BM=res[1];LI=res[2];
    return Promise.all([fetchHist("ga4"),fetchHist("clarity"),fetchHist("linkedin"),fetchHist("hubspot")]);
  }).then(function(){
    /* keep an explicit custom window across refreshes; otherwise re-apply the last preset (ends today) */
    if(!(MODE==="custom"&&WIN.start&&WIN.end))setPreset(LASTPRESET);
    applyWindow();
  })
   .catch(function(e){
    /* Only a genuine feed/network failure reaches here (render errors are isolated per-section
       above). Show a calm, non-technical note — never JS internals or deploy details. The real
       error goes to the console for the team. */
    if(window.console&&console.error)console.error("[dashboard] feed load failed:",e&&e.message,e);
    $("feed").className="pill off";$("feedTxt").textContent="Data refreshing…";
    var red=$("alertRed");red.classList.add("on");
    red.innerHTML='<span class="u">Live data is refreshing</span><p>The latest numbers didn’t come through just now. This normally clears on its own within a few minutes as the daily sync runs — try refreshing shortly. If it keeps happening, let the team know.</p>';
  });
}

$("pvTog").addEventListener("click",function(){
  PV=!PV;this.setAttribute("aria-pressed",PV?"true":"false");
  document.body.classList.toggle("preview",PV);
  document.title=(PV?"[PREVIEW] ":"")+"HDI · Marketing Performance";
  if(S)render();
});
$("botTog").addEventListener("click",function(){
  INCLBOTS=!INCLBOTS;this.setAttribute("aria-pressed",INCLBOTS?"true":"false");
  if(S)render();
});
Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){
  b.addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(x){x.setAttribute("aria-selected","false");});
    b.setAttribute("aria-selected","true");
    Array.prototype.forEach.call(document.querySelectorAll(".pane"),function(p){p.classList.remove("on");});
    $("p-"+b.dataset.t).classList.add("on");
  });
});
document.getElementById("rangeSeg").addEventListener("click",function(e){
  var b=e.target.closest("[data-d]");if(!b)return;
  setPreset(+b.dataset.d);   /* preset window ends today; "All" (0) spans full history */
  applyWindow();             /* re-window cached data client-side — no refetch */
});
/* Custom range: enable Apply only when both dates are valid, then apply on click. */
$("drFrom").addEventListener("change",validateApply);
$("drTo").addEventListener("change",validateApply);
$("drApply").addEventListener("click",function(){
  var f=$("drFrom").value, to=$("drTo").value;
  if(!f||!to||f>to)return;
  MODE="custom";WIN.start=f;WIN.end=to;
  applyWindow();
});
$("refresh").addEventListener("click",load);
load();
})();
</script>
</body>
</html>
